<text x="346.0" y="140" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.6" fill="#59636e">СХЕМА ПРИЛОЖЕНИЯ — ВЛАДЕЛЕЦ: ALEMBIC</text>
