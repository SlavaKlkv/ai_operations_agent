<text x="530.0" y="247.04" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">incident_analyses</text>
<rect x="68" y="276" width="172" height="44" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
