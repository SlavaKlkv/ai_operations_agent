<rect x="444" y="164" width="172" height="44" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="530.0" y="191.04" text-anchor="middle" font-size="14" font-weight="600" fill="#59636e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">alembic_version</text>
<rect x="68" y="220" width="172" height="44" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="154.0" y="247.04" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">agent_runs</text>
