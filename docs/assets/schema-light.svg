<rect x="664" y="120" width="288" height="276" rx="12" fill="none" stroke="#d1d9e0" stroke-width="1.25" stroke-dasharray="6 5"/>
<text x="808.0" y="140" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.6" fill="#59636e">ЧЕКПОИНТЕР · LANGGRAPH</text>
<rect x="680" y="164" width="256" height="56" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="808.0" y="180.48" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">checkpoints</text>
<text x="808.0" y="197.98" text-anchor="middle" font-size="12.5" fill="#59636e">thread_id · checkpoint_id</text>
<text x="808.0" y="212.48" text-anchor="middle" font-size="12.5" fill="#59636e">parent — цепочка версий</text>
<rect x="680" y="236" width="256" height="56" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="808.0" y="252.48" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">writes</text>
<text x="808.0" y="269.98" text-anchor="middle" font-size="12.5" fill="#59636e">task_id · channel</text>
<text x="808.0" y="284.48" text-anchor="middle" font-size="12.5" fill="#59636e">value</text>
<text x="680" y="326" text-anchor="start" font-size="12" fill="#59636e">BLOB = сериализованный AgentState</text>
<text x="680" y="346" text-anchor="start" font-size="12" fill="#59636e">allowlist типов · app/agent/serde.py</text>
<text x="52" y="408" text-anchor="start" font-size="12.5" fill="#59636e">API-движок (SQLAlchemy) и чекпоинтер открывают этот файл под WAL — это осознанный выбор.</text>
<text x="32" y="456" text-anchor="start" font-size="12.5" fill="#59636e">Группы нельзя бэкапить по отдельности: backup и restore (manage.sh) снимают файл целиком и покрывают обе.</text>
<text x="32" y="482" text-anchor="start" font-size="12.5" fill="#59636e">В серверном профиле те же две роли играют PostgreSQL: STORAGE_BACKEND=postgres и CHECKPOINTER=postgres.</text>
</svg>
