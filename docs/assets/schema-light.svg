<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="title">Схема данных AI Operations Agent</title>
  <desc id="desc">Один файл SQLite содержит две группы таблиц: схему приложения под Alembic и таблицы чекпоинтера LangGraph; бэкап охватывает обе.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
    <marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>
<text x="32" y="34" font-size="13.5" font-weight="700" letter-spacing="0.7" fill="#59636e">ХРАНЕНИЕ ДАННЫХ</text>
<text x="32" y="54" text-anchor="start" font-size="12.5" fill="#59636e">Один файл SQLite, две независимые группы таблиц с разными владельцами схемы.</text>
