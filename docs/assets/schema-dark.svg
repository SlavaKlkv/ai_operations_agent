<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="title">Схема данных AI Operations Agent</title>
  <desc id="desc">Один файл SQLite содержит две группы таблиц: схему приложения под Alembic и таблицы чекпоинтера LangGraph; бэкап охватывает обе.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9198a1"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4493f8"/>
    </marker>
    <marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#0d1117"/>
<text x="32" y="34" font-size="13.5" font-weight="700" letter-spacing="0.7" fill="#9198a1">ХРАНЕНИЕ ДАННЫХ</text>
<text x="32" y="54" text-anchor="start" font-size="12.5" fill="#9198a1">Один файл SQLite, две независимые группы таблиц с разными владельцами схемы.</text>
<rect x="32" y="84" width="936" height="332" rx="12" fill="none" stroke="#3d444d" stroke-width="1.25" stroke-dasharray="6 5"/>
<text x="46" y="104" font-size="12" font-weight="600" letter-spacing="0.6" fill="#9198a1">AI_OPERATIONS_AGENT.DB · ОДИН ФАЙЛ (WAL)</text>
<rect x="52" y="120" width="588" height="276" rx="12" fill="none" stroke="#3d444d" stroke-width="1.25" stroke-dasharray="6 5"/>
<text x="66" y="140" font-size="12" font-weight="600" letter-spacing="0.6" fill="#9198a1">СХЕМА ПРИЛОЖЕНИЯ — ВЛАДЕЛЕЦ: ALEMBIC</text>
