<rect x="444" y="164" width="172" height="44" rx="8" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="530.0" y="191.04" text-anchor="middle" font-size="14" font-weight="600" fill="#9198a1" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">alembic_version</text>
<rect x="68" y="220" width="172" height="44" rx="8" fill="#121d2f" stroke="#4493f8" stroke-width="1.5"/>
<text x="154.0" y="247.04" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">agent_runs</text>
<rect x="256" y="220" width="172" height="44" rx="8" fill="#0f2913" stroke="#3fb950" stroke-width="1.5"/>
<text x="342.0" y="247.04" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">tool_calls</text>
<rect x="444" y="220" width="172" height="44" rx="8" fill="#0f2913" stroke="#3fb950" stroke-width="1.5"/>
<text x="530.0" y="247.04" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">incident_analyses</text>
<rect x="68" y="276" width="172" height="44" rx="8" fill="#2b2412" stroke="#d29922" stroke-width="1.5"/>
<text x="154.0" y="303.04" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">approvals</text>
<rect x="256" y="276" width="172" height="44" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
