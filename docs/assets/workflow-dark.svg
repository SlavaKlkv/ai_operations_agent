<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 738" width="1000" height="738" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="title">Граф расследования</title>
  <desc id="desc">Воркфлоу на LangGraph: детерминированный сбор и корреляция, затем ограниченный цикл выбора инструментов, затем подтверждение человеком перед любой записью.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9198a1"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4493f8"/>
    </marker>
    <marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
  </defs>
  <rect width="1000" height="738" fill="#0d1117"/>
<text x="32" y="34" font-size="13.5" font-weight="700" letter-spacing="0.7" fill="#9198a1">ГРАФ РАССЛЕДОВАНИЯ</text>
<text x="32" y="54" text-anchor="start" font-size="12.5" fill="#9198a1">Сначала детерминированная работа, затем ограниченный агентный цикл, затем человек.</text>
<rect x="374.0" y="82" width="76" height="28" rx="14" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="412.0" y="101.04" text-anchor="middle" font-size="14" font-weight="600" fill="#9198a1">START</text>
<path d="M 412.0 110 L 412.0 132" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="300" y="132" width="224" height="58" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="412.0" y="156.73" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">analyze_task</text>
<text x="412.0" y="174.23" text-anchor="middle" font-size="12.5" fill="#9198a1">сервис и временное окно</text>
<path d="M 412.0 190 L 412.0 206" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="300" y="206" width="224" height="58" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="412.0" y="223.48" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">collect_initial_context</text>
<text x="412.0" y="240.98" text-anchor="middle" font-size="12.5" fill="#9198a1">метрики · деплои · ошибки ·</text>
<text x="412.0" y="255.48" text-anchor="middle" font-size="12.5" fill="#9198a1">алерты</text>
<path d="M 296 235 L 224 235" fill="none" stroke="#f85149" stroke-width="1.6" marker-end="url(#arrow-danger)"/>
<text x="260" y="222" text-anchor="middle" font-size="12" fill="#9198a1">нет сигнала</text>
<rect x="24" y="206" width="200" height="58" rx="8" fill="#2b1618" stroke="#f85149" stroke-width="1.5"/>
<text x="124.0" y="223.48" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">insufficient_context</text>
<text x="124.0" y="240.98" text-anchor="middle" font-size="12.5" fill="#9198a1">останавливается и</text>
<text x="124.0" y="255.48" text-anchor="middle" font-size="12.5" fill="#9198a1">объясняет</text>
<path d="M 412.0 264 L 412.0 280" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="300" y="280" width="224" height="58" rx="8" fill="#0f2913" stroke="#3fb950" stroke-width="1.5"/>
<text x="412.0" y="304.73" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">correlate</text>
<text x="412.0" y="322.23" text-anchor="middle" font-size="12.5" fill="#9198a1">всплеск ↔ деплой ↔ коммит</text>
<path d="M 412.0 338 L 412.0 382" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="184" y="352" width="372" height="264" rx="12" fill="none" stroke="#3d444d" stroke-width="1.25" stroke-dasharray="6 5"/>
<text x="198" y="372" font-size="12" font-weight="600" letter-spacing="0.6" fill="#9198a1">АГЕНТНЫЙ ЦИКЛ — ОГРАНИЧЕННЫЙ</text>
<rect x="300" y="382" width="224" height="58" rx="8" fill="#121d2f" stroke="#4493f8" stroke-width="1.5"/>
<text x="412.0" y="399.48" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">select_tool</text>
<text x="412.0" y="416.98" text-anchor="middle" font-size="12.5" fill="#9198a1">единственный реальный выбор</text>
<text x="412.0" y="431.48" text-anchor="middle" font-size="12.5" fill="#9198a1">модели</text>
<path d="M 412.0 440 L 412.0 458" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="300" y="458" width="224" height="58" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="412.0" y="475.48" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">execute_tool</text>
<text x="412.0" y="492.98" text-anchor="middle" font-size="12.5" fill="#9198a1">проверен · по таймауту ·</text>
<text x="412.0" y="507.48" text-anchor="middle" font-size="12.5" fill="#9198a1">записан</text>
<path d="M 412.0 516 L 412.0 534" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="300" y="534" width="224" height="58" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="412.0" y="558.73" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">evaluate_observation</text>
<text x="412.0" y="576.23" text-anchor="middle" font-size="12.5" fill="#9198a1">это что-то изменило?</text>
<path d="M 300 563 L 208 563 L 208 411 L 300 411" fill="none" stroke="#4493f8" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
<text x="156.0" y="491.0" text-anchor="middle" font-size="12" fill="#9198a1">есть что узнать</text>
<text x="196" y="604" text-anchor="start" font-size="12" fill="#9198a1">выход: без запроса · бюджет · нет прогресса · 4 итерации</text>
<path d="M 524 563 L 690 563" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="607.0" y="554.0" text-anchor="middle" font-size="12" fill="#9198a1">достаточно</text>
<rect x="676" y="534" width="224" height="58" rx="8" fill="#0f2913" stroke="#3fb950" stroke-width="1.5"/>
<text x="788.0" y="558.73" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">generate_analysis</text>
<text x="788.0" y="576.23" text-anchor="middle" font-size="12.5" fill="#9198a1">структурирован · заземлён</text>
<path d="M 788.0 534 L 788.0 512" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="676" y="454" width="224" height="58" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="788.0" y="478.73" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">propose_action</text>
<text x="788.0" y="496.23" text-anchor="middle" font-size="12.5" fill="#9198a1">уверенность ≥ 0.6, иначе ничего</text>
<path d="M 788.0 454 L 788.0 432" fill="none" stroke="#f85149" stroke-width="1.6" marker-end="url(#arrow-danger)"/>
<text x="798.0" y="443" text-anchor="start" font-size="12" fill="#9198a1">предложена запись</text>
<path d="M 676 479 L 636 479 L 636 190 L 680 190" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="626" y="300" text-anchor="end" font-size="12" fill="#9198a1">писать нечего</text>
<rect x="676" y="374" width="224" height="58" rx="8" fill="#2b2412" stroke="#d29922" stroke-width="1.5"/>
<text x="788.0" y="398.73" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">request_approval</text>
<text x="788.0" y="416.23" text-anchor="middle" font-size="12.5" fill="#9198a1">пауза · состояние в чекпоинте</text>
<path d="M 788.0 374 L 788.0 352" fill="none" stroke="#f85149" stroke-width="1.6" marker-end="url(#arrow-danger)"/>
<text x="798.0" y="363" text-anchor="start" font-size="12" fill="#9198a1">подтверждено</text>
<path d="M 900 399 L 940 399 L 940 190 L 896 190" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="934" y="300" text-anchor="end" font-size="12" fill="#9198a1">отклонено</text>
<rect x="676" y="294" width="224" height="58" rx="8" fill="#2b1618" stroke="#f85149" stroke-width="1.5"/>
<text x="788.0" y="318.73" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">execute_action</text>
<text x="788.0" y="336.23" text-anchor="middle" font-size="12.5" fill="#9198a1">один инструмент · один шаг</text>
<path d="M 788.0 294 L 788.0 248" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="676" y="190" width="224" height="58" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="788.0" y="214.73" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">final_response</text>
<text x="788.0" y="232.23" text-anchor="middle" font-size="12.5" fill="#9198a1">что сделал и чего не сделал</text>
<path d="M 788.0 190 L 788.0 164" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="756.0" y="136" width="64" height="28" rx="14" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="788.0" y="155.04" text-anchor="middle" font-size="14" font-weight="600" fill="#9198a1">END</text>
<rect x="32" y="634" width="936" height="72" rx="10" fill="#2b2412" stroke="#d29922" stroke-width="1.5"/>
<text x="500.0" y="675.04" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3"></text>
<text x="52" y="660" text-anchor="start" font-size="12.5" fill="#e6edf3">Пауза долговечная: состояние лежит в чекпоинте, поэтому решение приходит отдельным HTTP-запросом от отдельного человека —</text>
<text x="52" y="683" text-anchor="start" font-size="12.5" fill="#9198a1">а выполняется то действие, которое сохранил граф, а не то, что несёт подтверждающий запрос.</text>
</svg>
