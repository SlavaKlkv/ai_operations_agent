<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="title">Архитектура AI Operations Agent</title>
  <desc id="desc">Агент живёт за FastAPI-сервисом и дотягивается до четырёх внешних систем через MCP-серверы; состояние в SQLite или PostgreSQL, телеметрия в Prometheus.</desc>
