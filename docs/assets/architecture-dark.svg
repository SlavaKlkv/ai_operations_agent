<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="title">Архитектура AI Operations Agent</title>
  <desc id="desc">Агент живёт за FastAPI-сервисом и дотягивается до четырёх внешних систем через MCP-серверы; состояние в SQLite, телеметрия в Prometheus.</desc>
