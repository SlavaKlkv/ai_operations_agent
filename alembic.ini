# Shared configuration for a single database.

[alembic]
# Path to the migration scripts, normally relative to %(here)s (this file's
# directory), in POSIX form (forward slashes).
script_location = %(here)s/migrations

# Migration file name template; the default is %%(rev)s_%%(slug)s.
# Uncomment the line below to add date and time to the name.
# All available tokens are listed in the documentation:
# https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
# Files can also be grouped into date directories (needs recursive_version_locations = true).
# file_template = %%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

# Path prepended to sys.path. Defaults to the working directory; the separator
# for multiple paths is set by path_separator below.
prepend_sys_path = .

# Timezone for the date in a migration file and its name. Requires the tzdata
# package (installed via alembic[tz]). The value is passed to ZoneInfo(); empty
# means local time.
# timezone =

# Maximum length of the slug field.
# truncate_slug_length = 40

# Set to true to run the environment on the revision command regardless of
# autogenerate.
# revision_environment = false

# Set to true to treat .pyc and .pyo files without a source .py as revisions in
# the versions/ directory.
# sourceless = false

# Location of the revisions; defaults to <script_location>/versions. With
# several directories, initial revisions are set via --version-path using the
# separator below.
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# path_separator sets the separator for path lists, including version_locations
# and prepend_sys_path. The value `os` uses the platform os.pathsep.
#
# For compatibility with older alembic.ini files this default is not applied
# when path_separator is absent. In that case the following logic applies:
#
# 1. version_locations uses the old version_path_separator key, or is split on
#    spaces and commas.
# 2. prepend_sys_path is split on spaces, commas or colons.
#
# Allowed path_separator values:
#
# path_separator = :
# path_separator = ;
# path_separator = space
# path_separator = newline
#
# Use os.pathsep. Default for new projects.
path_separator = os


# Set to true to search for source files recursively in every version_locations
# directory. Added in Alembic 1.10.
# recursive_version_locations = false

# Encoding of revision files created from script.py.mako.
# output_encoding = utf-8

# The database URL is used only by this project's env.py; other configuration
# can be implemented there. sqlalchemy.url is set from the environment in
# migrations/env.py.


[post_write_hooks]
# post_write_hooks defines scripts or Python functions run for new revisions.
# Details and examples are in the documentation.

# Formatting via black with a console_scripts executor and the black entrypoint.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Check and fix via ruff with a module executor.
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Alternative: the exec executor runs a binary from PATH.
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Logging configuration is also used only by this project's env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
