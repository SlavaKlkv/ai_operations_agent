# Общая конфигурация для одной базы данных.

[alembic]
# Путь к сценариям миграции. Обычно задаётся в формате POSIX
# (с прямыми слешами) относительно %(here)s — каталога этого ini-файла.
script_location = %(here)s/migrations

# Шаблон имён файлов миграций; значение по умолчанию — %%(rev)s_%%(slug)s.
# Раскомментируйте строку ниже, чтобы добавить к имени дату и время.
# Все доступные токены перечислены в документации:
# https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
# Можно также распределять файлы по каталогам дат (нужен recursive_version_locations = true).
# file_template = %%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s

# Путь, добавляемый в начало sys.path. По умолчанию используется текущий рабочий
# каталог; разделитель нескольких путей задаётся параметром path_separator ниже.
prepend_sys_path = .

# Часовой пояс для даты в файле миграции и его имени. При указании требуется
# библиотека tzdata, устанавливаемая зависимостью `alembic[tz]`.
# Строковое значение передаётся в ZoneInfo(); пустое означает локальное время.
# timezone =

# Максимальная длина поля slug.
# truncate_slug_length = 40

# Установите true, чтобы запускать окружение при команде revision
# независимо от autogenerate.
# revision_environment = false

# Установите true, чтобы считать файлы .pyc и .pyo без исходного .py
# ревизиями в каталоге versions/.
# sourceless = false

# Расположение ревизий; по умолчанию <script_location>/versions. При нескольких
# каталогах начальные ревизии задаются через --version-path. Используется
# разделитель, указанный ниже в path_separator.
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# path_separator задаёт разделитель списков путей, включая version_locations
# и prepend_sys_path. Значение os использует системный os.pathsep.
#
# Для совместимости со старыми alembic.ini это значение по умолчанию не применяется,
# если path_separator отсутствует. Тогда действует следующая логика:
#
# 1. version_locations использует старый ключ version_path_separator, а без него
#    разделяется по пробелам и запятым.
# 2. prepend_sys_path разделяется по пробелам, запятым или двоеточиям.
#
# Допустимые значения path_separator:
#
# path_separator = :
# path_separator = ;
# path_separator = space
# path_separator = newline
#
# Использовать os.pathsep. Значение по умолчанию для новых проектов.
path_separator = os


# Установите true для рекурсивного поиска исходных файлов
# в каждом каталоге version_locations. Добавлено в Alembic 1.10.
# recursive_version_locations = false

# Кодировка файлов ревизий, создаваемых из script.py.mako.
# output_encoding = utf-8

# URL базы данных используется только поддерживаемым проектом env.py; другие
# способы настройки можно реализовать там же. sqlalchemy.url задаётся из
# окружения в migrations/env.py.


[post_write_hooks]
# post_write_hooks задаёт сценарии или функции Python, запускаемые для новых
# ревизий. Подробности и примеры приведены в документации.

# Форматирование через black с исполнителем console_scripts и точкой входа black.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Проверка и исправление через ruff с исполнителем module.
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Альтернатива: исполнитель exec запускает бинарный файл из PATH.
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Конфигурация логирования также используется только поддерживаемым проектом env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
