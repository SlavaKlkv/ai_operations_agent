# Конфигурация сбора метрик для локального стека.
#
# Единственная цель опрашивается часто: расследование занимает секунды, поэтому
# минутный интервал пропустил бы большую часть событий во время демо инцидента.

global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: ai-operations-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          environment: local
