name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --extra dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Аудит зависимостей работает только для pull request.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Audit locked dependencies for known vulnerabilities
        # GitHub dependency graph для этого репозитория недоступен, поэтому
        # проверяем зафиксированный lock-файл напрямую через pip-audit.
        # Версия pip-audit закреплена, чтобы результат не менялся от релиза к релизу.
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o requirements-audit.txt
          uvx 'pip-audit==2.10.1' -r requirements-audit.txt --disable-pip --progress-spinner off

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Веха 9: одни и те же тесты на всех заявленных платформах.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --extra dev
      - name: pytest
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml

  powershell:
    name: PowerShell scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse start.ps1 and manage.ps1
        # PowerShell Core есть на ubuntu-раннере: синтаксис проверяется без Windows.
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @("start.ps1", "manage.ps1")) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "${file}:$($_.Extent.StartLineNumber): $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "PowerShell-скрипты разбираются без ошибок."

  evaluate:
    name: Agent evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --extra dev
      - name: Evaluate the deterministic agent
        # Регрессия в планировщике, корреляции или анализе проявится здесь
        # как упавший сценарий, а не во время демо.
        env:
          MCP_ENABLED: "false"
          CHECKPOINTER: memory
        run: uv run python -m app.evaluation --quiet

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the user Compose configuration
        # Пользователь запускает именно этот файл из Release: проверяем, что он
        # разбирается и подставляет loopback-порт, не собирая образ.
        run: docker compose -f compose.yaml config
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ai-operations-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the production image
        # Образ успешно собрался — ещё не значит, что приложение стартует и
        # применяет миграции. Поднимаем его и проверяем живые ответы.
        run: |
          set -eu
          docker run -d --name aoa-smoke -p 127.0.0.1:8000:8000 \
            -e APP_ENV=local -e AUTH_ENABLED=false -e LLM_ENABLED=false \
            -e STORAGE_BACKEND=sqlite -e SQLITE_PATH=/srv/app/data/agent.db \
            -e CACHE_BACKEND=memory -e CHECKPOINTER=sqlite -e MCP_ENABLED=false \
            ai-operations-agent:ci
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs aoa-smoke
            docker rm -f aoa-smoke
            echo "приложение не поднялось за 30 секунд" >&2
            exit 1
          fi
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ | grep -q 'AI Operations Agent'
          # Мало поднять контейнер: прогоняем полный контур на самом образе —
          # расследование, остановку на подтверждении и защиту от повтора.
          python3 tools/smoke_investigation.py http://127.0.0.1:8000
          docker rm -f aoa-smoke
