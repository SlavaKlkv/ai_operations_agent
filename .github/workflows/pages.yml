name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/demo/**
      - docs/assets/demo-*.mp4
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the static demo
        run: |
          mkdir -p _site/assets
          cp docs/demo/index.html _site/index.html
          cp docs/assets/demo-dark.mp4 docs/assets/demo-light.mp4 _site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
