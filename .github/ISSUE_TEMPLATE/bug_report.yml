name: Сообщение об ошибке
description: Что-то не работает в локальном приложении
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт. **Не вставляйте токены, пароли, приватные ключи и содержимое
        volume.** Для диагностики используйте отчёт без секретов:
        `./manage.sh report agent-report.json` (или `manage.ps1 -Command report`).
        Уязвимости сообщайте приватно через Security → Report a vulnerability.
  - type: input
    id: version
    attributes:
      label: Версия
      description: Тег образа или версия из pyproject.toml
      placeholder: "0.3.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Операционная система
      options:
        - macOS
        - Windows
        - Linux
        - Другое
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Что вы сделали и что произошло
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Диагностический отчёт
      description: Приложите agent-report.json. Он уже маскирует секреты — проверьте перед отправкой.
    validations:
      required: false
