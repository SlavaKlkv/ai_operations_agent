[project]
name = "ai-operations-agent"
version = "0.1.0"
description = "Agentic incident-analysis system: LangGraph orchestration, MCP integrations, human-in-the-loop actions."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Slava Kulikov" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.1",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "redis>=5.2",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "langchain-ollama>=0.3.0",
    "mcp>=2.2",
    "langgraph-checkpoint-postgres>=3.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# Кириллица допустима в кодовой базе (русскоязычные задачи в тестах и фикстурах),
# поэтому проверки неоднозначных символов здесь создают только шум.
ignore = [
    "RUF001", "RUF002", "RUF003",
    # FastAPI объявляет зависимости через `Depends(...)` в значении по умолчанию.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Эти файлы создаёт Alembic; форматирование делает их изменения нечитаемыми.
"migrations/versions/*" = ["E501"]
"migrations/env.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
